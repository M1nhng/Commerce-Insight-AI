# =============================================================================
# Commerce Insight AI — Docker Compose
# =============================================================================
# Services:
#   - postgres    (PostgreSQL 16)
#   - backend     (Spring Boot API — port 8080)
#   - frontend    (React SPA via Nginx — port 5173)
#   - mcp-server  (Node.js MCP Server — port 3001)
#   - pgadmin     (PostgreSQL Admin UI — port 5050, dev profile only)
#
# Usage:
#   Development:  docker compose up
#   With PgAdmin: docker compose --profile dev-tools up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# =============================================================================

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-commerce_insight}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - cia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-commerce_insight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cia-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-commerce_insight}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-must-be-32-chars-minimum}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      MCP_API_KEY: ${MCP_API_KEY:-mcp-dev-secret-key-change-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SERVER_PORT: 8080
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - cia-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at build time (see frontend/Dockerfile).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: cia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - cia-network
    depends_on:
      backend:
        condition: service_healthy

  # ── MCP Server ────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: cia-mcp-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # mcp-server/src/config reads BACKEND_API_URL, PORT and MCP_TRANSPORT
      # (the previous BACKEND_BASE_URL / MCP_SERVER_PORT were silently ignored —
      # fixed in Sprint 13A).
      BACKEND_API_URL: http://backend:8080/api/v1
      PORT: "3001"
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_API_KEY: ${MCP_API_KEY:-mcp-dev-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MCP_PORT:-3001}:3001"
    networks:
      - cia-network
    healthcheck:
      # The MCP server always runs a lightweight /health HTTP listener on PORT,
      # independent of the stdio transport. 127.0.0.1 (not localhost) to avoid a
      # busybox ::1 first-resolution miss.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  # ── PgAdmin (dev-tools profile only) ─────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cia-pgadmin
    restart: unless-stopped
    profiles:
      - dev-tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@commerceinsight.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - cia-network
    depends_on:
      - postgres

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  cia-network:
    driver: bridge
    name: cia-network

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    name: cia-postgres-data
  pgadmin_data:
    driver: local
    name: cia-pgadmin-data
