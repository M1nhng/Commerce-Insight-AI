server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all unknown paths (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ── Security headers (Sprint 12B) ────────────────────────────────────────
    # `always` so they are emitted on error responses too. Kept in sync with
    # the backend Sprint 12A edge headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS — enable once the site is served over TLS only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content-Security-Policy for the SPA. The app ships only hashed ES modules
    # (no inline <script>). `style-src 'unsafe-inline'` is required by the
    # Tailwind runtime + inline style props; there is no inline script allowance.
    #
    # `connect-src` MUST list every origin the bundle calls. The bundle's API
    # origin is baked at build time from VITE_API_BASE_URL (default
    # http://localhost:8080 — see frontend/Dockerfile). When you build for a
    # real environment, replace the localhost entries below with your API origin
    # (e.g. https://api.example.com), or serve the API same-origin behind this
    # nginx and drop them, leaving just 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080 https://localhost:8080; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
