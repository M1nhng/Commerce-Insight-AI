# =============================================================================
# application-e2e.yml — profile for end-to-end / integration verification
# =============================================================================
# Layered on top of application.yml. Purpose: run the REAL security stack
# (JWT, RBAC, rate limiting, headers, envelopes) against a disposable Postgres,
# with deterministic test data and LOW rate-limit thresholds so the 429 E2E
# scenarios do not need to wait a full minute.
#
# SECURITY IS NOT DISABLED HERE. Only the tuning values differ from dev.
#
# Activate: SPRING_PROFILES_ACTIVE=e2e   (docker-compose.e2e.yml sets this)
#           ./mvnw spring-boot:run -Dspring-boot.run.profiles=e2e
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commerce_insight_e2e}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # Base schema + the E2E-only repeatable seed. This extra location is what
    # keeps R__seed_e2e_users.sql out of dev / test / prod.
    locations: classpath:db/migration,classpath:db/e2e
    validate-on-migrate: true

# Actuator health must be reachable for the Docker healthcheck.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # Test-only secret. >= 32 bytes, and deliberately NOT the committed dev
    # default so it is obvious in logs which secret is in use. Never a prod value.
    secret: ${JWT_SECRET:e2e-only-signing-secret-not-for-production-0123456789ABCDEF}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:1}
    issuer: commerce-insight-ai

  mcp:
    api-key: ${MCP_API_KEY:e2e-only-mcp-api-key-not-for-production}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    allow-credentials: false

  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    request-id-header: X-Request-Id

  # Rate limiting stays ON (real security path). `login` / `refresh` are set
  # high enough to survive a full serial Playwright run that logs in many times;
  # the 429 E2E scenario deliberately targets the low-capacity `export` bucket
  # instead. `import-upload` / `export` stay small so their 429 tests trip fast.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      capacity: ${RL_LOGIN_CAPACITY:50}
      window-seconds: 60
      secondary-capacity: 0
      secondary-window-seconds: 0
    register:
      capacity: 10
      window-seconds: 3600
    refresh:
      capacity: ${RL_REFRESH_CAPACITY:50}
      window-seconds: 60
    import-upload:
      capacity: ${RL_IMPORT_CAPACITY:3}
      window-seconds: 60
    export:
      capacity: ${RL_EXPORT_CAPACITY:3}
      window-seconds: 60

logging:
  level:
    root: INFO
    com.commerceinsight: INFO
    org.springframework.security: WARN
