# =============================================================================
# application-demo.yml — profile for local demo / showcase environments
# =============================================================================
# Layered on top of application.yml. Purpose: run the REAL application stack
# (JWT, RBAC, rate limiting, headers, envelopes, analytics) against a dedicated
# demo database that is pre-populated with a large, deterministic, realistic
# ecommerce dataset (db/demo/R__seed_demo_data.sql).
#
# SECURITY IS NOT DISABLED HERE. Only tuning values and the DB name differ.
#
# Activate explicitly — production NEVER activates this automatically:
#   SPRING_PROFILES_ACTIVE=demo
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Production safety: the demo seed lives in classpath:db/demo, which is ONLY
# added to spring.flyway.locations by THIS profile. application.yml and
# application-prod.yml use classpath:db/migration only, so a production boot can
# never see, let alone run, the demo seed. See docs/demo/SPRINT_13C_DEMO_DATA.md.
#
# All secrets in this file are DEMO-ONLY and safe to commit. Never reuse them.
# =============================================================================

spring:
  datasource:
    # Dedicated demo database — separate from dev (commerce_insight_dev),
    # e2e (commerce_insight_e2e) and prod (commerce_insight).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commerce_insight_demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate          # Hibernate never touches the schema
    show-sql: false

  flyway:
    enabled: true
    # Base schema + the DEMO-only repeatable seed. This extra location is what
    # keeps R__seed_demo_data.sql out of dev / test / e2e / prod.
    locations: classpath:db/migration,classpath:db/demo
    validate-on-migrate: true

# Actuator health must be reachable for the Docker healthcheck.
management:
  endpoints:
    web:
      # metrics is exposed so /actuator/metrics/ai.insights.* is queryable in the
      # demo; SecurityConfig restricts everything past health/info to ROLE_ADMIN.
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # Demo-only secret. >= 32 bytes and deliberately NOT the committed dev or
    # prod default, so logs make it obvious which secret is in use. Never prod.
    secret: ${JWT_SECRET:demo-only-signing-secret-not-for-production-0123456789ABCDEF}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 min
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    issuer: commerce-insight-ai

  mcp:
    api-key: ${MCP_API_KEY:demo-only-mcp-api-key-not-for-production}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
    allow-credentials: false

  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
    request-id-header: X-Request-Id

  # Rate limiting stays ON (real security path). Limits are raised so a person
  # clicking through every Dashboard screen during a demo is never throttled.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      capacity: ${RL_LOGIN_CAPACITY:50}
      window-seconds: 60
      secondary-capacity: 200
      secondary-window-seconds: 3600
    register:
      capacity: 20
      window-seconds: 3600
    refresh:
      capacity: ${RL_REFRESH_CAPACITY:100}
      window-seconds: 60
    import-upload:
      capacity: ${RL_IMPORT_CAPACITY:30}
      window-seconds: 60
    export:
      capacity: ${RL_EXPORT_CAPACITY:30}
      window-seconds: 60
    ai-insights:
      capacity: ${RL_AI_CAPACITY:20}
      window-seconds: 3600

  # AI insights stay OFF in the demo unless the operator supplies a real key.
  # With no key the dashboard's AI card simply shows "temporarily unavailable" —
  # every other screen is unaffected. To enable during a demo, set on the
  # backend container:  AI_INSIGHTS_ENABLED=true  OPENAI_API_KEY=sk-...
  ai:
    enabled: ${AI_INSIGHTS_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    model: ${AI_MODEL:gpt-4o-mini}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}

logging:
  level:
    root: INFO
    com.commerceinsight: INFO
    org.springframework.security: WARN
