spring:
  datasource:
    url: jdbc:tc:postgresql:16:///commerce_insight_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    com.commerceinsight: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: test-secret-key-at-least-32-characters-for-testing-purposes-only
    access-token-expiration-ms: 300000
    refresh-token-expiration-days: 1
  cors:
    allowed-origins: http://localhost:5173
  mcp:
    api-key: test-mcp-api-key
