# =============================================================================
# Commerce Insight AI — Production Profile
# All secrets MUST be provided via environment variables.
# NEVER commit real credentials.
# =============================================================================

spring:
  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.commerceinsight: INFO
  file:
    name: /var/log/commerce-insight-ai/application.log

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── API docs: disabled in production ─────────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Application Custom Properties (explicit in prod — no silent base defaults) ─
# Secrets MUST come from the environment. SecretsValidator aborts startup if a
# committed development value or a sub-256-bit JWT secret is detected here.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    issuer: ${JWT_ISSUER:commerce-insight-ai}
  mcp:
    api-key: ${MCP_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
