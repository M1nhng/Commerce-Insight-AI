# =============================================================================
# Commerce Insight AI — Production Profile
# All secrets MUST be provided via environment variables.
# NEVER commit real credentials.
# =============================================================================

spring:
  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.commerceinsight: INFO
  file:
    name: /var/log/commerce-insight-ai/application.log

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoint:
    health:
      show-details: never
