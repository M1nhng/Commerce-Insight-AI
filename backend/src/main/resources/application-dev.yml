spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_insight_dev
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    com.commerceinsight: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173
