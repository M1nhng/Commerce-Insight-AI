# =============================================================================
# Commerce Insight AI — Development Profile
# Activated with: -Dspring-boot.run.profiles=dev
# =============================================================================

spring:
  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/commerceinsight
    username: cia_user
    password: changeme
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # ── DevTools ───────────────────────────────────────────────────────────────
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.commerceinsight: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ── Dev overrides ─────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3001
