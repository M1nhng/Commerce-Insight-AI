# =============================================================================
# Nginx Reverse Proxy Configuration — Commerce Insight AI
# =============================================================================
# NOTE: This is a placeholder. Finalize when production deployment is planned.
#       See docs/13_DEVOPS.md for deployment strategy.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        # ── Edge security headers (Sprint 12A) ──────────────────────────────
        # Defense-in-depth: the Spring Boot app also sets these on /api/**.
        # 'always' so they are emitted on error responses too.
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=()" always;
        # Enable once TLS terminates here:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Frontend (React SPA)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;  # SPA fallback

            # SPA needs inline styles / same-origin XHR; tighten to taste.
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        }

        # Backend API proxy
        location /api/ {
            proxy_pass         http://backend:8080/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
