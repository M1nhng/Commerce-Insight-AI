# =============================================================================
# docker-compose.demo.yml — local demo / showcase overlay
# =============================================================================
# Overlays docker-compose.yml. Brings the FULL existing stack up with the
# backend `demo` Spring profile: real security (JWT, RBAC, rate limiting,
# headers), a dedicated demo database (commerce_insight_demo) on its own volume,
# and the large deterministic dataset from db/demo/R__seed_demo_data.sql applied
# automatically by Flyway on first boot.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#   # open http://localhost:5173  — log in as demo-admin@commerceinsight.demo
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v   # reset
#
# Reuses the existing backend / frontend / mcp-server images and build contexts
# unchanged — only environment and the DB name/volume differ.
#
# Every secret here is DEMO-ONLY and safe to commit. Never reuse in production.
# See docs/demo/SPRINT_13C_DEMO_DATA.md.
# =============================================================================

services:

  postgres:
    environment:
      POSTGRES_DB: commerce_insight_demo
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_insight_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: commerce_insight_demo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: demo-only-signing-secret-not-for-production-0123456789ABCDEF
      MCP_API_KEY: demo-only-mcp-api-key-not-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      RATE_LIMIT_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18            # first boot runs 31 migrations + the demo seed
      start_period: 45s

  frontend:
    # The image bakes VITE_API_BASE_URL at build time; with no .env it falls back
    # to http://localhost:8080, correct for this overlay (browser -> host :8080).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  mcp-server:
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8080/api/v1
      PORT: "3001"
      MCP_TRANSPORT: stdio
      MCP_API_KEY: demo-only-mcp-api-key-not-for-production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_demo_data:
    driver: local
    name: cia-postgres-demo-data
