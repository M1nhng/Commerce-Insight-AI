# =============================================================================
# CI Pipeline — Commerce Insight AI
# =============================================================================
# Verification only — NO production deployment (see cd.yml, still a placeholder).
#
# Jobs:
#   backend   — compile + full JUnit/Spring suite against a disposable Postgres
#   frontend  — tsc --noEmit, Vitest, production build
#   mcp       — type-check, node:test, build
#   security  — scripts/security-check.mjs (static secret / leak scan)
#   e2e       — full Docker stack (docker-compose.e2e.yml) + Playwright
#
# All E2E secrets are test-only (application-e2e.yml / docker-compose.e2e.yml).
# No repository secrets are referenced; nothing is echoed.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, "sprint*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # ── Backend: build + integration tests ──────────────────────────────────
  backend:
    name: Backend (Java ${{ '17' }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Must match backend/src/test/resources/application-test.yml
        env:
          POSTGRES_DB: commerce_insight
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_insight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile + run the full test suite
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ── Frontend: type-check + unit tests + build ───────────────────────────
  frontend:
    name: Frontend (Node ${{ '20' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  # ── MCP server: type-check + tests + build ──────────────────────────────
  mcp:
    name: MCP server (Node ${{ '20' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Type-check
        working-directory: mcp-server
        run: npm run type-check

      - name: Tests
        working-directory: mcp-server
        run: npm test

      - name: Build
        working-directory: mcp-server
        run: npm run build

  # ── Static security scan ───────────────────────────────────────────────
  security:
    name: Security static scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: security-check.mjs
        run: node scripts/security-check.mjs

  # ── End-to-end (Docker stack + Playwright) ─────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the E2E stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy" >&2
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200 backend >&2
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ >/dev/null; then echo "frontend up"; exit 0; fi
            sleep 3
          done
          echo "frontend did not come up" >&2; exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
