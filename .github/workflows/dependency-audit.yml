# =============================================================================
# Dependency Audit — Commerce Insight AI  
# =============================================================================
# NON-BLOCKING. Runs weekly + on demand. Kept OUT of ci.yml because:
#   - OWASP Dependency-Check downloads the multi-hundred-MB NVD data set and
#     the NVD API rate-limits callers without a key (set NVD_API_KEY secret).
#   - npm audit findings here are advisory (tracked as accepted risks in
#     docs/SPRINT_13A_PRODUCTION_READINESS.md), not merge gates.
# =============================================================================

name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend + mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend — production deps
        working-directory: frontend
        run: npm audit --omit=dev || true
      - name: Frontend — all deps
        working-directory: frontend
        run: npm audit || true
      - name: MCP server
        working-directory: mcp-server
        run: npm audit || true

  owasp:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Run dependency-check (advisory)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -Powasp -DskipTests -Dnvd.api.key="$NVD_API_KEY" verify
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 30
