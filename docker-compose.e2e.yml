# =============================================================================
# docker-compose.e2e.yml — end-to-end verification overlay
# =============================================================================
# Overlays docker-compose.yml. Brings the full stack up with the backend `e2e`
# Spring profile: real security, disposable Postgres, deterministic seed users
# (R__seed_e2e_users.sql), and LOW rate-limit thresholds for fast 429 tests.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#   ...run Playwright against http://localhost:5173...
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
#
# All secrets here are test-only and safe to commit. Never reuse in production.
# =============================================================================

services:

  postgres:
    environment:
      POSTGRES_DB: commerce_insight_e2e
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_insight_e2e"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: commerce_insight_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: e2e-only-signing-secret-not-for-production-0123456789ABCDEF
      MCP_API_KEY: e2e-only-mcp-api-key-not-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      RATE_LIMIT_ENABLED: "true"
      # login/refresh high enough for a full serial Playwright run; the 429
      # scenario targets the low-capacity export bucket instead.
      RL_LOGIN_CAPACITY: "50"
      RL_REFRESH_CAPACITY: "50"
      RL_IMPORT_CAPACITY: "3"
      RL_EXPORT_CAPACITY: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    # The image bakes VITE_API_BASE_URL at build time; with no .env it falls back
    # to http://localhost:8080 (see src/services/axios.ts), which is correct for
    # this overlay since the browser reaches the backend on the host's :8080.
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # and nginx only listens on IPv4 → false "connection refused".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  mcp-server:
    environment:
      NODE_ENV: production
      # NOTE: mcp-server/src/config reads BACKEND_API_URL and PORT. The base
      # docker-compose.yml sets BACKEND_BASE_URL / MCP_SERVER_PORT, which the
      # config ignores (pre-existing infra mismatch — see SPRINT_12C doc).
      # Corrected here so the E2E MCP actually reaches the backend.
      BACKEND_API_URL: http://backend:8080/api/v1
      PORT: "3001"
      MCP_TRANSPORT: stdio
      MCP_API_KEY: e2e-only-mcp-api-key-not-for-production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_e2e_data:
    driver: local
    name: cia-postgres-e2e-data
